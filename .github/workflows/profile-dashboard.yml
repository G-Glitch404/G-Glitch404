name: Update GitHub Profile Dashboard

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate.py"
      - "README.md"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: git pull --rebase origin main

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python generate.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg assets/stats.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile dashboard"

      - name: Sync before push
        run: git pull --rebase origin main

      - name: Push dashboard
        run: git push origin main
