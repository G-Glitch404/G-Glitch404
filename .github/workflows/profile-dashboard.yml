name: Update GitHub Profile Dashboard

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate.py"
      - "README.md"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python generate.py

      - name: Commit dashboard
        id: commit
        run: |
          git add assets/dashboard.svg assets/stats.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update profile dashboard"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push dashboard
        if: steps.commit.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 2
          done

          echo "Failed to push dashboard after 5 attempts"
          exit 1
